[package]
name = "anix-pulse"
version = "0.1.0"
description = "Native Tauri v2 + Rust system HUD, network audit, VRAM monitor, and Kill-Switch for AI coding agents, MCP servers, and local LLMs."
authors = ["an1zy"]
edition = "2021"

[lib]
name = "anix_pulse_lib"
crate-type = ["rlib"]
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
