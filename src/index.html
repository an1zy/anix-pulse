<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>anix.pulse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span class="pulse-dot"></span>
        <span class="brand-name">anix<span class="brand-dot">.pulse</span></span>
        <span class="brand-tag">v0.1</span>
      </div>
      <div class="titlebar-actions">
        <button id="btn-unload" class="btn-panic" title="Unload all active Ollama models from VRAM">Unload VRAM</button>
        <button id="btn-min" class="win-btn" aria-label="Minimize">
          <svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" /></svg>
        </button>
        <button id="btn-max" class="win-btn" aria-label="Maximize">
          <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
        </button>
        <button id="btn-close" class="win-btn win-close" aria-label="Close">
          <svg viewBox="0 0 12 12"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5" /><line x1="9.5" y1="2.5" x2="2.5" y2="9.5" /></svg>
        </button>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <div class="card-head">
          <span class="card-title">Hardware &amp; VRAM</span>
          <span id="gpu-name" class="pill pill-mono">Detecting...</span>
        </div>
        <div class="vram-stats">
          <div class="ring-box">
            <svg viewBox="0 0 120 120" class="ring-svg">
              <circle cx="60" cy="60" r="50" class="ring-bg" />
              <circle id="vram-ring" cx="60" cy="60" r="50" class="ring-fg" />
            </svg>
            <div class="ring-center">
              <div id="vram-pct" class="ring-val">0%</div>
              <div class="ring-sub">VRAM</div>
            </div>
          </div>
          <div class="hw-metrics">
            <div class="metric">
              <span class="m-label">VRAM</span>
              <span id="vram-detail" class="m-val">-</span>
            </div>
            <div class="metric">
              <span class="m-label">RAM</span>
              <span id="ram-detail" class="m-val">-</span>
            </div>
            <div class="metric">
              <span class="m-label">GPU</span>
              <span id="gpu-thermal" class="m-val">-</span>
            </div>
          </div>
        </div>
        <div id="fit-chips" class="fit-chips"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <span class="card-title">Local Proxy</span>
          <span id="proxy-status" class="pill pill-green">127.0.0.1:8787</span>
        </div>
        <div class="mode-switch">
          <button data-mode="local_first" class="mode-btn active">Local-First</button>
          <button data-mode="cloud_only" class="mode-btn">Cloud Fallback</button>
          <button data-mode="paused" class="mode-btn mode-stop">Kill-Switch</button>
        </div>
        <div class="proxy-counters">
          <div class="counter"><span class="m-label">REQUESTS</span><strong id="p-total">0</strong></div>
          <div class="counter"><span class="m-label">LOCAL</span><strong id="p-local">0</strong></div>
          <div class="counter"><span class="m-label">CLOUD</span><strong id="p-cloud">0</strong></div>
          <div class="counter"><span class="m-label">TOKENS</span><strong id="p-tokens">0</strong></div>
        </div>
        <div class="fallback-row">
          <input id="cloud-url" type="text" placeholder="https://openrouter.ai/api/v1/chat/completions" />
          <input id="cloud-key" type="password" placeholder="API key" />
          <button id="btn-save-cloud" class="btn-secondary">Save</button>
        </div>
        <div id="proxy-events" class="event-list"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <span class="card-title">Active Processes</span>
          <span id="proc-count" class="pill pill-muted">0 active</span>
        </div>
        <div class="radar-table-wrap">
          <table class="radar-table">
            <thead>
              <tr>
                <th>Type</th>
                <th>Process</th>
                <th>PID</th>
                <th>RAM</th>
                <th>CPU</th>
                <th>Network</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="radar-body"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <span class="card-title">Alerts &amp; Audit</span>
          <span id="alert-count" class="pill pill-muted">0 alerts</span>
        </div>
        <div id="alerts-list" class="alerts-list"></div>
        <div class="guard-controls">
          <label>RAM MB <input id="cfg-ram" type="number" value="4096" min="256" /></label>
          <label>VRAM % <input id="cfg-vram" type="number" value="92" min="50" max="99" /></label>
          <label class="chk"><input id="cfg-mcp-net" type="checkbox" checked /> MCP TCP alert</label>
          <button id="btn-save-guard" class="btn-secondary">Apply</button>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
